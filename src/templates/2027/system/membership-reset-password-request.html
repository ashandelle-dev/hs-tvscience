<!--
  templateType: membership_reset_request_page
  isAvailableForNewContent: true
  label: System - Membership reset password request (2027)
-->
{% extends "../../../layouts/2027/base.html" %}

{% block body %}
<main id="main-content">
  <section class="bg-grey-050 py-16 md:py-24">
    <div class="wrap">
      <div class="mx-auto max-w-copy">
        <p class="m-0 mb-4 text-body-relaxed font-bold text-black">Private content</p>
        <h1 class="m-0 text-balance text-heading-sm font-heavy text-black md:text-heading-hero">Reset your password</h1>
        <p class="m-0 mt-6 text-body-relaxed text-grey-350">We’ll email you a link to reset your password.</p>
        <div class="system-card mt-10 rounded-32 bg-white p-8 md:p-10">
          {% password_reset_request "my_password_reset_request"
            email_label="Email",
            submit_button_text="Send email" %}
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock body %}
