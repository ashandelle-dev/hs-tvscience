  templateType: email_subscriptions_confirmation_page
  isAvailableForNewContent: true
  label: System - Email subscriptions confirmation (2027)

{% extends "../../../layouts/2027/base.html" %}

{% block body %}
<main id="main-content">
  <section class="bg-grey-050 py-16 md:py-24">
    <div class="wrap">
      <div class="mx-auto max-w-copy">
        <p class="m-0 mb-4 text-body-relaxed font-bold text-black">Email preferences</p>
        <h1 class="m-0 text-balance text-heading-sm font-heavy text-black md:text-heading-hero">Your preferences are saved</h1>
        
        <div class="system-card mt-10 rounded-32 bg-white p-8 md:p-10">
          {% module "subscriptions_confirmation" path="@hubspot/email_subscriptions_confirmation", label="Subscriptions confirmation" %}
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock body %}
